name: Fetch YouTube transcripts

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "YouTube URL(s), separated by spaces or commas"
        required: true
  push:
    paths:
      - requests.txt

permissions:
  contents: write

concurrency:
  group: fetch-transcripts
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -U -r requirements.txt

      - name: Fetch transcripts
        env:
          URLS: ${{ github.event.inputs.urls }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: python fetch_transcript.py

      - name: Commit new transcripts
        run: |
          git config user.name "transcript-bot"
          git config user.email "transcript-bot@users.noreply.github.com"
          git add transcripts/
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Add transcripts"
            git pull --rebase
            git push
          fi
